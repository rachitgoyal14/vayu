name: Hourly AQI Data Fetch v2

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aqi-fetch
  cancel-in-progress: true

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests python-dotenv

      - name: Fetch AQI Data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python -m forecaster.fetch_and_store_aqi

      - name: Commit and push CSV
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Save freshly fetched 29 rows
          cp forecaster/hourlyData.csv /tmp/hourlyData_new.csv

          # Switch to data branch and grab existing CSV
          git checkout data
          cp forecaster/hourlyData.csv /tmp/hourlyData_old.csv 2>/dev/null || touch /tmp/hourlyData_old.csv

          # Merge old + new using Python
          python3 - <<'EOF'
import pandas as pd

try:
    old = pd.read_csv("/tmp/hourlyData_old.csv")
    print(f"Loaded {len(old)} existing rows")
except Exception:
    old = pd.DataFrame()
    print("No existing rows found")

new = pd.read_csv("/tmp/hourlyData_new.csv")
df = pd.concat([old, new]).drop_duplicates(subset=["city", "datetime"])
df = df.sort_values(["city", "datetime"]).reset_index(drop=True)
df.to_csv("forecaster/hourlyData.csv", index=False)
print(f"Total rows after merge: {len(df)}")
EOF

          git add forecaster/hourlyData.csv
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Update AQI data [auto] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin data --force