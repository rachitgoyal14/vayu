name: Hourly AQI Data Fetch

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aqi-fetch
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests python-dotenv

      - name: Fetch AQI Data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python -m forecaster.fetch_and_store_aqi

      - name: Commit and push CSV
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add forecaster/hourlyData.csv
          git diff --cached --quiet && echo "No changes" && exit 0

          for i in 1 2 3 4 5; do
            git pull --rebase origin main

            git add forecaster/hourlyData.csv
            git diff --cached --quiet && echo "No changes" && exit 0

            git commit -m "Update AQI data [auto]" || true

            git push origin HEAD && echo "Push succeeded" && exit 0

            echo "Retry $i failed, waiting..."
            git reset --soft HEAD~1 2>/dev/null || true
            sleep $((i * 5))
          done

          echo "All retries failed"
          exit 1