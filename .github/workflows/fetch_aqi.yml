name: Hourly AQI Data Fetch

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # 🔥 THIS FIXES YOUR ERROR

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # also upgraded

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests python-dotenv

      - name: Fetch AQI Data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python -m forecaster.fetch_and_store_aqi

      - name: Commit and push CSV
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add forecaster/hourlyData.csv
          git diff --quiet && echo "No changes" || git commit -m "Update AQI data [auto]"
          git push